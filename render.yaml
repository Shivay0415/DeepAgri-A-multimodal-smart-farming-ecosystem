services:
  - type: web
    name: deepagri-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: cd backend && pip install -r requirements.txt && python manage.py bootstrap_demo_models && python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate && gunicorn agri_platform.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: deepagri-frontend
    runtime: static
    plan: free
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: deepagri-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
